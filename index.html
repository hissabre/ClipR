<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{background:#090E16}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CLIPR</title>

<style>
/* Obsidian Atelier: one dark look by design. 480px phone column; frosted top/bottom bars; sheets slide up with a rim light.
   Cobalt = actions and live route. Brass = earned status and ratings. Crimson = urgent signals only. */
:root{
  --paper:#090E16; --surface:#121A26; --sunk:#0E1520; --raise:#171F2C; --ink:#E7ECF3; --muted:#9AA6B8; --faint:#6F7B8D; --line:#223042;
  --accent:#7A9BFF; --accent-soft:#1A2747; --on-accent:#08101F; --pole:#F0655A; --brass:#D9B064; --brass-deep:#9A6F1E; --brass-soft:#2B2414;
  --good:#4FCB98; --good-soft:#12291F; --warn:#E6AE52; --warn-soft:#2C2213; --bad:#F27B70; --bad-soft:#321715;
  --map-bg:#141E2C; --map-road:#22304A; --map-water:#1B3050; --map-park:#17301F; --map-trav:#33415A; --scrim:rgba(0,0,0,.65);
  --glass:rgba(18,26,38,.78); --rim:inset 0 1px 0 rgba(255,255,255,.06); --halo:0 0 0 3px var(--accent-soft);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --display:'Archivo Narrow','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Work Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:700;line-height:1.08}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:400;letter-spacing:-.02em}
b.num,b.mono{font-weight:700}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px} .stack-s{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}

#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#05080D;color:var(--muted);border-bottom:1px solid var(--line);padding:7px max(12px,env(safe-area-inset-right,0px)) 7px max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;font-size:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#05080D}
.demobar .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 6px;border:1px solid currentColor;border-radius:4px;opacity:.8}
.seg-dark{display:flex;background:rgba(127,140,160,.22);border-radius:8px;padding:2px;margin-left:auto}
.seg-dark button{padding:4px 9px;border-radius:6px;font-weight:600;font-size:12px;color:inherit;opacity:.75}
.seg-dark button.on{background:var(--accent);color:var(--on-accent);opacity:1}

.screen{padding:14px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-stretch:115%;font-size:17px;letter-spacing:-.01em}
.pole{width:10px;height:22px;border-radius:5px;background:repeating-linear-gradient(-55deg,var(--pole) 0 4px,var(--surface) 4px 7px,var(--accent) 7px 11px,var(--surface) 11px 14px);box-shadow:inset 0 0 0 1px var(--line)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;flex:none}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--pole);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.citybtn{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;min-width:0}
.citybtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hero{display:flex;flex-direction:column;gap:6px}
.addr{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.addr button{color:var(--accent);font-weight:600}

.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding:2px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.sm{padding:5px 10px;font-size:13px}
.daychip{flex:none;min-width:64px;padding:9px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px}
.daychip b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.05}
.daychip small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.daychip small.mono{text-transform:none;letter-spacing:0;font-weight:400}
.daychip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:var(--halo)} .daychip.on small{color:inherit;opacity:.8}
.daychip.off{opacity:.4}

.tools{display:flex;align-items:center;gap:8px}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font-weight:600;font-size:13px;max-width:150px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-accent{background:var(--accent-soft);color:var(--accent)} .p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)} .p-brass,.p-vip{background:var(--brass-soft);color:var(--brass);border:1px solid var(--brass-deep)}
.p-pro{background:var(--good-soft);color:var(--good);border:1px solid rgba(79,203,152,.35)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--rim)}
.list > * + *{border-top:1px solid var(--line)}
.bcard{display:flex;gap:12px;padding:14px;align-items:flex-start;cursor:pointer;text-align:left;width:100%;position:relative}
.bcard:hover{background:var(--sunk)}
.bname{font-weight:700;font-size:16px}
.bcard .meta{font-size:13px;color:var(--muted);margin-top:2px}
.bprice{text-align:right;flex:none}
.bprice small{display:block;font-size:11px;color:var(--muted)}
.bprice b{font-family:var(--mono);font-size:15px}
.why{font-size:12px;font-weight:700;color:var(--brass);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.heart{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--faint)}
.heart.on{color:var(--pole)}
.avatar{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);font-stretch:100%;letter-spacing:.02em}
.vbadge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--accent)}
.vbadge.id{color:var(--muted)}
.slotchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.slotchip.now{background:var(--good-soft);color:var(--good);border-color:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--rim)}
.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.b-accent{background:var(--accent-soft);color:var(--ink)} .b-warn{background:var(--warn-soft)} .b-good{background:var(--good-soft)} .b-bad{background:var(--bad-soft)}
.b-demo{border:1px dashed var(--faint);background:transparent;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap;transition:transform .08s,box-shadow .15s}
.btn:active:not([disabled]){transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.01em}
.btn.primary.sm{font-size:14px}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:rgba(242,123,112,.25)} .btn.good{background:var(--good);border-color:var(--good);color:#06140E;font-family:var(--display);font-size:16px;font-weight:700}
.btn.brass{background:var(--brass-soft);border-color:var(--brass-deep);color:var(--brass)}
.btn.block{width:100%} .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--accent);font-weight:600}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line);display:flex;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--faint);position:relative}
.tabbar button.on{color:var(--accent)}
.tabbar .dot{top:2px;right:calc(50% - 20px)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:min(100%,480px);max-height:94%;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);position:relative;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet:not(.full) .sheet-head{padding-top:20px;border-radius:22px 22px 0 0}
.sheet-head h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;flex:1}
.sheet-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);display:flex;gap:10px;align-items:center}
.sheet-foot.col{flex-direction:column;align-items:stretch;gap:8px}
@keyframes up{from{transform:translateY(40px);opacity:.4}} @keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 12px;font-size:15px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--halo)}
textarea.input{min-height:76px;resize:vertical}
.err{color:var(--bad);font-size:13px;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;width:100%;text-align:left}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.opt.radio .box{border-radius:50%}
.opt.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.on{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:1px;align-items:center}
.slot span{font-family:var(--display);font-size:19px;font-weight:700}
.slot small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.slot.on small{color:inherit}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--halo)}
.breakdown{display:flex;flex-direction:column;gap:7px;font-size:14px}
.breakdown .row{justify-content:space-between}
.breakdown .total{border-top:1px solid var(--line);padding-top:9px;font-weight:700;font-size:16px}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle.on{background:var(--good)} .toggle.on::after{left:21px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats > div{background:var(--surface);padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-family:var(--display);font-size:20px;font-weight:750;font-stretch:90%;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats span{font-size:12px;color:var(--muted)}
.stats.two{grid-template-columns:repeat(2,1fr)}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid figure{margin:0;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:1;max-width:100%}
.pgrid figure svg{width:100%;height:100%;display:block}
.pgrid figcaption{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(10,15,25,.62);color:#fff;padding:2px 6px;border-radius:5px}
.review{display:flex;flex-direction:column;gap:5px;padding:14px}
.stars{color:var(--brass);letter-spacing:1px;font-size:13px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;margin-top:1px}
.tl.done i{background:var(--good);border-color:var(--good)} .tl.cur i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:3px}
.msgwarn{align-self:center;font-size:12px;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:10px;max-width:92%;text-align:center}
.stampcard{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--faint);max-width:100%}
.stamp.on{border:2px solid var(--brass);background:var(--brass-soft);color:var(--brass)}
.skel{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.1s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 16px}
.empty .ico{width:56px;height:56px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.mapwrap{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.mapwrap>svg{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;max-width:min(440px,calc(100% - 32px));box-shadow:var(--shadow);animation:up .2s}
.check{width:72px;height:72px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;margin:8px auto 0;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl td.r,.tbl th.r{text-align:right}
.scrollx{overflow-x:auto}
.hours{display:flex;flex-direction:column}
.hours .hr{display:flex;align-items:center;gap:8px;padding:9px 12px}
.hours select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 4px;font-family:var(--mono);font-size:13px}
.track-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track-bar i{display:block;height:100%;background:var(--good);width:0;transition:width 1s linear}

function busy(bid,exclude){return state.bookings.filter(x=>x.barberId===bid&&LIVE.includes(x.status)&&x.id!==exclude)}
function slotsFor(b,day,dur,exclude){
 const h=b.hours[new Date(day).getDay()];if(!h||!h.on||b.blocked.includes(dkey(day)))return[];
 const now=Date.now(),lead=Math.max(30,travelMin(b)+10)*MIN,bs=busy(b.id,exclude),out=[];
 for(let m=h.s;m+dur<=h.e;m+=15){const t0=atMin(day,m);if(t0<now+lead)continue;
  const clash=bs.some(x=>t0<x.start+(x.dur+b.buffer)*MIN&&x.start<t0+(dur+b.buffer)*MIN);if(!clash)out.push(t0)}
 return out;
}
function nextSlot(b,dur,days=7){for(let i=0;i<days;i++){const s=slotsFor(b,addDays(dayStart(Date.now()),i),dur);if(s.length)return s[0]}return null}
const partOk=ts=>{const h=new Date(ts).getHours();return ui.part==='any'||(ui.part==='morning'&&h<12)||(ui.part==='afternoon'&&h>=12&&h<17)||(ui.part==='evening'&&h>=17)};

function pickSvcs(b,keys){let use=keys.slice(),extra=[];const combo=b.services.find(s=>s.key==='combo'),cutK=keys.find(k=>k==='fade'||k==='classic');
 if(combo&&keys.includes('beard')&&cutK){const be=b.services.find(s=>s.key==='beard'),cu=b.services.find(s=>s.key===cutK);if(!be||!cu||combo.price<be.price+cu.price){use=use.filter(k=>k!=='beard'&&k!==cutK);extra=[combo]}}
 const out=use.map(k=>b.services.find(s=>s.key===k));if(out.some(x=>!x))return null;return out.concat(extra)}
function durFor(b){if(ui.f.svcs.length){const p=pickSvcs(b,ui.f.svcs);if(p)return p.reduce((a,s)=>a+s.dur,0)}const s=b.services.find(x=>x.key==='fade')||b.services[0];return s?s.dur:45}
function slotInfo(b){
 const dur=durFor(b);
 if(ui.mode==='now'){const s=nextSlot(b,dur,3);if(!s)return null;return{t:s,now:s-Date.now()<=100*MIN}}
 const s=slotsFor(b,ui.day,dur).filter(partOk)[0];return s?{t:s,now:false}:null;
}

function priceFor(b){if(ui.f.svcs.length){const p=pickSvcs(b,ui.f.svcs);return p?p.reduce((a,s)=>a+s.price,0):null}return Math.min(...b.services.map(s=>s.price))}

function results(){
 const c=city(),f=ui.f;
 let list=state.barbers.filter(b=>b.cityId===c.id&&listed(b)&&b.dist<=b.radius&&!state.customer.blocked.includes(b.id));
 if(f.svcs.length)list=list.filter(b=>pickSvcs(b,f.svcs));
 if(f.verified)list=list.filter(b=>b.verify==='pro');
 if(f.minRating)list=list.filter(b=>rating(b)>=f.minRating);
 if(f.years)list=list.filter(b=>b.years>=f.years);
 if(f.lang)list=list.filter(b=>b.langs.includes(f.lang));
 let rows=list.map(b=>{const slot=slotInfo(b),price=priceFor(b);return{b,slot,price}});
 if(f.maxPrice)rows=rows.filter(r=>r.price<=f.maxPrice);
 if(ui.mode==='later')rows=rows.filter(r=>r.slot);
 if(ui.mode==='now'&&f.nowOnly)rows=rows.filter(r=>r.slot&&r.slot.now);
 const prices=rows.map(r=>r.price).sort((a,b)=>a-b),median=prices[Math.floor(prices.length/2)]||0;
 rows.forEach(r=>{const b=r.b;let s=rating(b)*22-b.dist*2.4+(b.verify==='pro'?6:0)+Math.min(b.completed,400)/45+(b.plan==='elite'?6:b.plan==='pro'?3:0);const why=[];
  const past=myBookings().filter(x=>x.barberId===b.id&&x.status==='completed').length;
  if(past){s+=18;why.push(t('You’ve booked before'))}
  if(state.customer.favorites.includes(b.id)){s+=10;if(!past)why.push(t('In your favourites'))}
  if(r.slot){if(r.slot.now){s+=24;why.push(t('Arrives in {m} min',{m:Math.max(10,Math.round((r.slot.t-Date.now())/MIN))}))}else s+=6}else s-=60;
  if(r.price<median)s+=3;if(rating(b)>=4.9)why.push(t('Top rated'));
  r.score=s;r.why=why});
 const cmp={match:(a,b)=>b.score-a.score,near:(a,b)=>a.b.dist-b.b.dist,rating:(a,b)=>rating(b.b)-rating(a.b),price:(a,b)=>a.price-b.price,popular:(a,b)=>b.b.completed-a.b.completed}[ui.sort];
 rows.sort(cmp);return rows;
}

function quote(b,ids,d){
 const c=city(b.cityId),items=b.services.filter(s=>ids.includes(s.id));
 const sub=items.reduce((a,s)=>a+s.price,0),dur=items.reduce((a,s)=>a+s.dur,0),travel=b.travelFee||0,offers=[];
 if(d&&d.promoApplied){const p=state.promos.find(p=>p.code===d.promoApplied);if(p)offers.push({label:t('Code {c}',{c:p.code}),amt:rnd(sub*p.pct/100,c.cur),src:'promo'})}
 if(stamps()>=5&&!(d&&d.editingId))offers.push({label:t('Stamp card reward'),amt:rnd(sub*.3,c.cur),src:'stamp'});
 if(d&&d.useReward&&state.customer.rewards>0)offers.push({label:t('Referral reward'),amt:rnd(sub*.2,c.cur),src:'ref'});
 offers.sort((a,b)=>b.amt-a.amt);const best=offers[0],disc=best?best.amt:0;
 const fee=rnd((sub+travel-disc)*state.settings.fee/100,c.cur);
 return{items,sub,dur,travel,disc,discLabel:best?best.label:'',discSrc:best?best.src:'',fee,total:rnd(sub+travel-disc+fee,c.cur),cur:c.cur,multi:offers.length>1};
}

function hashStr(x){let h=7;for(const ch of x)h=(h*31+ch.charCodeAt(0))|0;return h}

 const pts=[{...start}];let cur={...start},vert=R()<.5,guard=0;

  if(vert&&cur.y!==end.y){const n=Math.abs(end.y-cur.y)/G,k=Math.max(1,Math.round(n*(.35+R()*.65)));cur={x:cur.x,y:cur.y+Math.sign(end.y-cur.y)*Math.min(k,n)*G};pts.push({...cur})}

 if(bk.status==='enroute'){const rem=Math.max(1,Math.ceil(bk.eta*(1-p))),near=p>=.72;return{stage:near?1:0,p,label:near?t('{n} is almost here',{n:first}):t('{n} is heading to you',{n:first}),sub:p>=1?t('Arriving now'):t('{m} min · {k} km',{m:rem,k:fKm(b.dist*(1-p))}),eta:Date.now()+rem*MIN}}

function barChart(data,fmt){const W=340,H=150,P=24,max=Math.max(1,...data.map(d=>d.v)),bw=(W-P)/data.length;
 const nice_=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=[1,2,2.5,5,10].find(k=>k*p>=max);return m*p})();
 return`<div class="scrollx"><svg class="chart" viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Chart"><line x1="${P}" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/><line x1="${P}" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="3 3"/>
 <text x="0" y="12">${esc(fmt(nice_))}</text>${data.map((d,i)=>{const h=d.v/nice_*(H-16),x=P+i*bw+bw*.18,last=i===data.length-1;return`<rect x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="3" fill="${last?'var(--accent)':'var(--accent-soft)'}"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></rect>${i%2===data.length%2||last?`<text x="${(x+bw*.32).toFixed(1)}" y="${H+14}" text-anchor="middle">${esc(d.l)}</text>`:''}`}).join('')}</svg></div>`}

/* ======================== Barber plans & boosts ======================== */
const PLAN_INFO={starter:{n:'Starter',perks:['Listed in search','Bookings, chat and secure payments','Free payouts in 2 days']},
 pro:{n:'Pro',perks:['Lower commission on every booking','Higher placement in search','One free 3-day boost every month','Earnings insights']},
 elite:{n:'Elite',perks:['Lowest commission','Top placement in search','Free instant payouts','Featured on the city page','Team accounts for up to 5 barbers']}};
function planCard(b){const c=city(b.cityId),p=b.plan||'starter',pr=planPrice(p,b.cityId);
 return`<section class="card stack-s"><div class="row"><h3 class="grow">${t('Your plan')}</h3><span class="pill ${p==='starter'?'p-mute':'p-brass'}">${t(PLAN_INFO[p].n)}</span></div>
 <p class="small muted">${t('{c}% commission per booking',{c:planComm(b)})}${pr?' · '+t('{p}/month',{p:money(pr,c.cur)}):''}</p>
 <button class="btn sm" style="align-self:flex-start" data-a="sheet" data-v="plans">${t('Compare plans')}</button></section>`}
function sPlans(){const b=meB(),c=city(b.cityId),since=Date.now()-30*DAY,sel=ui.planSel||b.plan;
 const gross=state.bookings.filter(x=>x.barberId===b.id&&x.status==='completed'&&x.completedAt>=since).reduce((a,x)=>a+x.price.sub+x.price.travel,0);
 const keep=k=>rnd(gross*(1-state.settings.plans[k].comm/100)-planPrice(k,b.cityId),c.cur);
 const best=['starter','pro','elite'].sort((x,y)=>keep(y)-keep(x))[0];
 const body=`<p class="muted small">${t('Pick the plan that fits how much you work. Change or cancel any time.')}</p>
 ${['starter','pro','elite'].map(k=>{const pr=planPrice(k,b.cityId),on=sel===k;return`<button class="card stack-s" style="text-align:left;${on?'border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)':''}" data-a="planSel" data-v="${k}" aria-pressed="${on}">
  <div class="row"><h2 class="grow">${t(PLAN_INFO[k].n)}</h2>${k===b.plan?`<span class="pill p-mute">${t('Current plan')}</span>`:''}${k===best&&gross?`<span class="pill p-good">${t('Best for you')}</span>`:''}</div>
  <div class="row" style="gap:14px;align-items:baseline"><b class="num" style="font-size:20px">${pr?money(pr,c.cur):t('Free')}</b>${pr?`<span class="small muted">/ ${t('month')}</span>`:''}<span class="grow"></span><b>${state.settings.plans[k].comm}%</b><span class="small muted">${t('commission')}</span></div>
  <ul style="margin:0;padding:0;list-style:none" class="stack-s">${PLAN_INFO[k].perks.map(x=>`<li class="row small" style="gap:6px;align-items:flex-start"><span style="color:var(--good)">${ic('check',16)}</span>${t(x)}</li>`).join('')}</ul>
  ${gross?`<p class="tiny muted">${t('On your last 30 days ({g} in bookings) you would keep {k}.',{g:money(gross,c.cur),k:money(keep(k),c.cur)})}</p>`:''}</button>`}).join('')}`;
 const pr=planPrice(sel,b.cityId);
 return{title:t('Plans'),body,foot:sel===b.plan?`<button class="btn grow" disabled>${t('Current plan')}</button>`:`<div class="grow tiny muted">${pr?t('{p} today, then monthly. Cancel any time.',{p:money(pr,c.cur)}):t('No monthly fee.')}</div><button class="btn primary" data-a="switchPlan">${t('Switch to {n}',{n:t(PLAN_INFO[sel].n)})}</button>`}}
function boostCard(b){const c=city(b.cityId),now=Date.now();if(!listed(b))return'';
 if(b.boostUntil>now){const hrs=(now-b.boostStart)/HOUR,impr=Math.round(hrs*16+20),taps=Math.round(impr*.07);
  return`<section class="card stack-s"><div class="row"><span class="pill p-good live">${t('Boost active')}</span><span class="grow"></span><span class="small muted">${t('Until {d}',{d:fDay(b.boostUntil)})}</span></div><div class="stats two"><div><span>${t('Times shown first')}</span><b class="num">${impr}</b></div><div><span>${t('Profile taps')}</span><b class="num">${taps}</b></div></div></section>`}

function pushSheet(s){ui.sheets.push(s);renderSheet()}

function renderSheet(){const root=document.getElementById('sheetroot'),top=ui.sheets[ui.sheets.length-1];
 const prev=root.querySelector('.sheet-body'),y=prev?prev.scrollTop:0,sameKey=root.dataset.key;
 if(!top){root.innerHTML='';root.dataset.key='';document.body.style.overflow='';return}
 const fn={barber:sBarber,book:sBook,done:sDone,booking:sBooking,thread:sThread,review:sReview,report:sReport,notes:sNotes,city:sCity,addr:sAddr,filters:sFilters,personal:sPersonal,svc:sSvc,editProfile:sEditProfile,onboard:sOnboard,track:sTrack,plans:sPlans,boost:sBoost}[top.type];
 const v=fn(top),key=top.type+(top.id||'')+ui.sheets.length;
 root.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet ${v.full?'full':''}" role="dialog" aria-modal="true" aria-label="${esc(v.title||'')}">${v.full?'':'<i class="grab" aria-hidden="true"></i>'}<div class="sheet-head">${ui.sheets.length>1?`<button class="iconbtn" data-a="closeSheet" aria-label="${t('Back')}">${ic('back')}</button>`:''}${v.head||`<h2>${esc(v.title||'')}</h2>`}<button class="iconbtn" data-a="closeAll" aria-label="${t('Close')}">${ic('x')}</button></div><div class="sheet-body">${v.body}</div>${v.foot?`<div class="sheet-foot ${v.footCol?'col':''}">${v.foot}</div>`:''}</div></div>`;
 if(sameKey===key&&root.firstChild)root.querySelector('.scrim').style.animation='none',root.querySelector('.sheet').style.animation='none';
 const body=root.querySelector('.sheet-body');if(!body){}else if(v.scrollEnd)body.scrollTop=body.scrollHeight;else if(sameKey===key)body.scrollTop=y;
 root.dataset.key=key;document.body.style.overflow='hidden';tick();
}

  if(o.step===1&&(!o.name.trim()||!o.bio.trim()))o.err=t('Please fill in your name and bio.');
  if(o.step===2&&!Object.keys(o.svc).length)o.err=t('Pick at least one service.');
  if(o.step===4&&!o.docs.id)o.err=t('Upload your ID to continue.');
  if(o.err){renderSheet();return}
  if(o.step<4){o.step++;renderSheet();const b=document.querySelector('.sheet-body');if(b)b.scrollTop=0;return}
  const c=city(o.cityId),id=uid('b-'+o.cityId),[ws,we]=o.wd.split('-').map(Number),hours={};
  for(let d=0;d<7;d++){if(d===0||d===6){if(o.we==='off')hours[d]={on:false,s:ws,e:we};else{const[a,b]=o.we.split('-').map(Number);hours[d]={on:true,s:a,e:b}}}else hours[d]={on:true,s:ws,e:we}}
  const R=Math.random;state.barbers.push({id,cityId:o.cityId,name:o.name.trim(),hue:Math.round(R()*360),years:+o.years||0,specs:o.specs.length?o.specs:[SPECS[0]],langs:[c.langs[0]],bio:o.bio.trim(),radius:o.radius,dist:+(1+R()*Math.min(o.radius-1,6)).toFixed(1),bearing:R()*360,
   ratingN:0,ratingSum:0,completed:0,cancels:0,verify:'pending',status:'active',instant:true,buffer:20,hours,blocked:[],policy:'flexible',travelFee:0,views:0,area:c.hoods[0],respond:15,joined:new Date().getFullYear(),
   portfolio:Array.from({length:3},(_,k)=>({style:STYLES[k],top:.25,fade:.3,tone:TONES[k],hair:HAIRS[0]})),docs:{...o.docs},
   services:Object.entries(o.svc).map(([k,p])=>({id:id+'-'+k,key:k,name:SVC[k].n,price:+p||nice(c.base*SVC[k].m),dur:SVC[k].d,desc:SVC[k].desc}))});
  state.meBarberId=id;state.role='barber';ui.tab.barber='today';notify('admin','New barber awaiting verification: {n}',{n:o.name.trim()});save();ui.sheets=[];render();window.scrollTo(0,0);toast(t('Welcome to CLIPR'))},
 // admin
 verify:d=>{const b=bar(d.id);b.verify=d.v;if(d.v!=='rejected')notify('b:'+b.id,'Your profile is live. Status: {s}',{s:d.v==='pro'?'Verified pro':'ID checked'});save();render()},
 suspend:d=>{const b=bar(d.id);b.status=b.status==='suspended'?'active':'suspended';save();render()},
 resolve:d=>{const r=state.reports.find(x=>x.id===d.id),bk=r.bookingId&&state.bookings.find(x=>x.id===r.bookingId);
  const amt=bk?(d.v==='full'?bk.price.total:d.v==='half'?rnd(bk.price.total/2,bk.price.cur):0):0;if(bk&&amt){bk.refund=(bk.refund||0)+amt;bk.pay='partial'}
  r.status='resolved';r.resolution=d.v==='full'?'Refund':d.v==='half'?'Partial refund':'No refund';if(bk&&bk.customer==='me')notify('c','Your report was resolved: {r}',{r:t(r.resolution)+(amt?' '+money(amt,bk.price.cur):'')},bk.id);save();render()},
 hideReview:d=>{const r=state.reviews.find(x=>x.id===d.id),b=bar(r.barberId);r.hidden=true;if(b.ratingN>1){b.ratingN--;b.ratingSum-=r.rating}save();render()},
 keepReview:d=>{state.reviews.find(x=>x.id===d.id).kept=true;save();render()},
 promoToggle:d=>{const p=state.promos.find(x=>x.code===d.v);p.active=!p.active;save();render()},
 npFirst:()=>{ui.np.code=val('npCode');ui.np.pct=val('npPct');ui.np.first=!ui.np.first;render()},
 createPromo:()=>{const code=val('npCode').trim().toUpperCase().replace(/\s+/g,''),pct=parseInt(val('npPct'));
  if(!code||!(pct>=1&&pct<=90)||state.promos.some(p=>p.code===code)){ui.np={code,pct:val('npPct'),first:ui.np.first,err:t('Enter a code and a discount between 1 and 90.')};render();return}
  state.promos.push({code,pct,active:true,first:ui.np.first,uses:0});ui.np=null;save();render();toast(t('Saved'))},
 cityToggle:d=>{state.cityActive[d.v]=!state.cityActive[d.v];save();render()},
 sendAnn:()=>{const txt=val('annText').trim();if(!txt)return;const a={id:uid('an'),text:txt,t:Date.now()};state.announcements.push(a);state.notes.unshift({id:uid('n'),to:'c',text:['{n}',{n:txt}],t:Date.now(),read:false});save();render();toast(t('Announcement sent'))},
};
/* change handlers for inputs */
const C={
 sort:e=>{ui.sort=e.value;render()},
 notes:e=>{ui.draft.notes=e.value}, promo:e=>{ui.draft.promo=e.value},
 rvText:e=>{ui.rv.text=e.value}, rpText:e=>{ui.rp.text=e.value},
 fPrice:e=>{const c=city(),max=+e.max;ui.f.maxPrice=+e.value>=max?0:+e.value;renderSheet();render()},
 hs:e=>{const h=meB().hours[e.dataset.d];h.s=+e.value;if(h.e<=h.s)h.e=h.s+60;save();render()},
 he:e=>{const h=meB().hours[e.dataset.d];h.e=+e.value;if(h.e<=h.s)h.s=h.e-60;save();render()},
 meSel:e=>{state.meBarberId=e.value;save();render();window.scrollTo(0,0)},
 epBio:e=>{ui.ep.bio=e.value}, epYears:e=>{ui.ep.years=e.value}, epFee:e=>{ui.ep.travelFee=e.value}, epRadius:e=>{ui.ep.radius=+e.value;renderSheet()},
 obName:e=>{ui.ob.name=e.value}, obCity:e=>{ui.ob.cityId=e.value;const c=city(e.value);for(const k in ui.ob.svc)ui.ob.svc[k]=nice(c.base*SVC[k].m);renderSheet()}, obYears:e=>{ui.ob.years=e.value}, obBio:e=>{ui.ob.bio=e.value},
 obPrice:e=>{ui.ob.svc[e.dataset.k]=e.value}, obRadius:e=>{ui.ob.radius=+e.value;renderSheet()},
 obFile:e=>{const f=e.files&&e.files[0];if(f){ui.ob.docs[e.dataset.k]=f.name;ui.ob.err='';renderSheet()}},
 certUp:e=>{const f=e.files&&e.files[0];if(!f)return;const b=meB();b.docs.cert=f.name;if(b.verify==='id'||b.verify==='rejected')b.verify='pending';notify('admin','New barber awaiting verification: {n}',{n:b.name});save();render();toast(t('Documents submitted'))},
 adCity:e=>{ui.adminCity=e.value;render()}, adStatus:e=>{ui.adminStatus=e.value;render()},
 planComm:e=>{state.settings.plans[e.dataset.p].comm=Math.max(0,Math.min(40,+e.value||0));save();render();toast(t('Saved'))},
 planPrice:e=>{state.settings.plans[e.dataset.p].price=Math.max(0,Math.min(10,+e.value||0));save();render();toast(t('Saved'))},
 boostDay:e=>{state.settings.boostDay=Math.max(.01,Math.min(2,+e.value||.15));save();render();toast(t('Saved'))},
 payoutFee:e=>{state.settings.payoutFee=Math.max(0,Math.min(5,+e.value||0));save();render();toast(t('Saved'))},
 setFee:e=>{state.settings.fee=Math.max(0,Math.min(20,+e.value||0));save();toast(t('Saved'))},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;
 if(el.dataset.a!=='scrim')e.preventDefault();fn(el.dataset,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-a][tabindex]')){e.preventDefault();e.target.click()}
 if(e.key==='Enter'&&e.target.id==='msgIn'){e.preventDefault();const b=document.querySelector('[data-a="sendMsg"]');if(b)b.click()}
 if(e.key==='Enter'&&['gPhone','gEmail'].includes(e.target.id)){e.preventDefault();A.gSend()}
 if(e.key==='Enter'&&e.target.id==='gCode'){e.preventDefault();A.gVerify()}
 if(e.key==='Escape'&&ui.sheets.length)popSheet()});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.c;if(k&&C[k]&&!['notes','promo','rvText','rpText','epBio','obName','obBio','obYears','epYears','epFee','obPrice'].includes(k))C[k](e.target)});
document.addEventListener('input',e=>{if(e.target.id==='gCode'&&e.target.value.replace(/\D/g,'').length===4){A.gVerify();return}const k=e.target.dataset&&e.target.dataset.c;if(k&&['notes','promo','rvText','rpText','epBio','obName','obBio','obYears','epYears','epFee','obPrice'].includes(k))C[k](e.target)});

/* ======================== Background simulation ======================== */
function housekeeping(){let changed=false;const now=Date.now();
 state.bookings.forEach(bk=>{
  if(bk.status==='requested'&&bk.barberId!==state.meBarberId&&now-bk.createdAt>7000){setStatus(bk,'confirmed');changed=true;}
  if(bk.status==='enroute'){const p=prog(bk);if(p>=.72&&!bk.nAlmost){bk.nAlmost=true;bk.timeline.push({s:'almost',t:now});if(bk.customer==='me')notify('c','{n} is almost here, about {m} min away. Get the door ready.',{n:bar(bk.barberId).name,m:Math.max(1,Math.ceil(bk.eta*(1-p)))},bk.id);changed=true}
   if(p>=1){setStatus(bk,'arrived');changed=true}}
  if(bk.status==='confirmed'&&bk.customer==='me'&&!bk.nLeaving&&bk.start>now&&bk.start-now<=60*MIN){bk.nLeaving=true;const b=bar(bk.barberId);notify('c','{n} is getting ready. Leaves around {t}.',{n:b.name,t:'@t'+(bk.start-travelMin(b)*MIN)},bk.id);changed=true}
  if(bk.status==='requested'&&bk.start<now){bk.status='expired';bk.timeline.push({s:'expired',t:now});changed=true}
  if(bk.status==='confirmed'&&bk.customer==='me'&&!bk.reminded&&bk.start-now<24*HOUR&&bk.start>now){bk.reminded=true;notify('c','Reminder: {n} arrives {w}',{n:bar(bk.barberId).name,w:'@'+bk.start},bk.id);changed=true}
 });
 if(changed){save();if(!document.activeElement||!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))render()}
}
setInterval(housekeeping,2000);
(function loop(){try{tick()}catch(e){}requestAnimationFrame(loop)})();
function splashDone(){const sp=document.getElementById('splash');if(!sp||sp.classList.contains('out'))return;sp.classList.add('out');setTimeout(()=>sp.remove(),460)}
function gIntroDone(){if(ui.tour){ui.tour=false;render();window.scrollTo(0,0);return}ui.gate='auth';render()}
(function(){const tg=document.getElementById('stag');if(tg)tg.textContent=t('Barbers who come to you');let rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}setTimeout(splashDone,rm?350:2350)})();
let swX=null;document.addEventListener('pointerdown',e=>{swX=e.target.closest&&e.target.closest('.intro')?e.clientX:null});
document.addEventListener('pointerup',e=>{if(swX===null)return;const dx=e.clientX-swX;swX=null;if(Math.abs(dx)<60)return;if(dx<0)A.gNext();else if(ui.slide>0){ui.slide--;render()}});
render();housekeeping();
</script>
